qlib_init:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn

sys:
  rel_path:
    - C:/Users/30855/Desktop/frozen_hl378_mw2e4_T40_D2_20260528(2)/code

market: csi500
benchmark: SH000905

data_handler_config:
  start_time: '2008-01-01'
  end_time: '2019-12-31'
  fit_start_time: '2008-01-01'
  fit_end_time: '2019-06-30'
  instruments: csi500

port_analysis_config: &id001
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 40
      n_drop: 2
  backtest:
    start_time: '2019-07-01'
    end_time: '2019-12-31'
    account: 100000000
    benchmark: SH000905
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: open
      open_cost: 0.001
      close_cost: 0.002
      min_cost: 5

task:
  model:
    class: RecencyWeightedLGBModel
    module_path: lgb_recency_weighted_model
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: -1
      num_leaves: 63
      num_threads: 4
      min_data_in_leaf: 100
      recency_half_life_days: 378
      recency_min_weight: 0.0002
      recency_ref_date: '2019-06-30'
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158Label20PlusConfirm
        module_path: alpha158_label20_plus_confirm_handler
        kwargs:
          start_time: '2008-01-01'
          end_time: '2019-12-31'
          fit_start_time: '2008-01-01'
          fit_end_time: '2019-06-30'
          instruments: csi500
          label:
          - Ref($close, -20) / $close - 1
      segments:
        train:
        - '2008-01-01'
        - '2015-06-30'
        valid:
        - '2015-07-01'
        - '2019-06-30'
        test:
        - '2019-07-01'
        - '2019-12-31'

  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id001

group1_experiment:
  name: HL378_MW2E4_2019H2

group5_port_refine_experiment:
  name: HL378_MW2E4_2019H2
  topk: 40
  n_drop: 2
  note: "router semiannual rolling | model=hl378_mw2e4 | fit_end=2019-06-30 | train=2008-01-01~2015-06-30 | valid=2015-07-01~2019-06-30 | test=2019-07-01~2019-12-31"

